name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        # 3.12 solo en Linux: en un repo privado macOS cuesta x10 minutos y Windows x2.
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      # Acciones fijadas por SHA: un tag se puede mover, un commit no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  # El wheel instalado de verdad (pip, pipx, uvx, uv tool) responde como CLI y como MCP.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash   # también en Windows (Git Bash): un solo script para los tres
    env:
      # Rutas relativas: Git Bash no tiene que traducir nada para el Python de Windows.
      PIPX_HOME: _pipx/home
      PIPX_BIN_DIR: _pipx/bin
      UV_TOOL_DIR: _uv/tools
      UV_TOOL_BIN_DIR: _uv/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Herramientas (versiones fijas)
        run: python -m pip install build==1.6.1 pipx==1.18.4 uv==0.13.4
      - name: Construir wheel y sdist
        run: python -m build
      - name: pip
        run: |
          WHL=$(ls dist/*.whl)
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python -m venv _pip
          BIN=_pip/bin; [ -d _pip/Scripts ] && BIN=_pip/Scripts
          "$BIN/python" -m pip install "$WHL[mcp]"
          python tests/smoke_install.py --version "$VERSION" \
            --cli "$BIN/jinnexguard" --mcp "$BIN/jinnexguard-mcp"
      - name: pipx
        run: |
          python -m pipx install "$(ls dist/*.whl)[mcp]"
          python tests/smoke_install.py --version "$VERSION" \
            --cli "_pipx/bin/jinnexguard" --mcp "_pipx/bin/jinnexguard-mcp"
      - name: uvx
        run: |
          WHL=$(ls dist/*.whl)
          python tests/smoke_install.py --version "$VERSION" \
            --cli "uvx --from $WHL jinnexguard" --mcp "uvx --from $WHL[mcp] jinnexguard-mcp"
      - name: uv tool install
        run: |
          uv tool install "$(ls dist/*.whl)[mcp]"
          python tests/smoke_install.py --version "$VERSION" \
            --cli "_uv/bin/jinnexguard" --mcp "_uv/bin/jinnexguard-mcp"
      - name: Sin el extra [mcp], jinnexguard-mcp explica qué instalar
        run: |
          python -m venv _bare
          BIN=_bare/bin; [ -d _bare/Scripts ] && BIN=_bare/Scripts
          "$BIN/python" -m pip install "$(ls dist/*.whl)"
          if "$BIN/jinnexguard-mcp" < /dev/null 2> err.txt; then exit 1; fi
          grep -q "jinnexguard\[mcp\]" err.txt
