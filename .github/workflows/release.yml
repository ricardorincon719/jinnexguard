name: release

# Publica en PyPI con Trusted Publishing (OIDC): no hay token guardado en ningún lado.
# PyPI confía en este archivo (release.yml) de este repo y en el environment indicado.
#   - Tag vX.Y.Z  → PyPI (environment "pypi").
#   - A mano (Run workflow en main) → TestPyPI (environment "testpypi"), para ensayar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}   # cada job pide solo lo que necesita

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Acciones fijadas por SHA: un tag se puede mover, un commit no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Herramientas (versiones fijas)
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Solo desde un tag vX.Y.Z o desde main
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::The TestPyPI rehearsal only runs from main (got $REF)"; exit 1
          fi
      - name: El tag, pyproject y __version__ dicen la misma versión
        env:
          REF: ${{ github.ref }}
        run: |
          PROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          CODE=$(python -c "import jinnexguard; print(jinnexguard.__version__)")
          echo "pyproject=$PROJECT __version__=$CODE ref=$REF"
          [ "$PROJECT" = "$CODE" ] || { echo "::error::pyproject.toml and __version__ differ"; exit 1; }
          case "$REF" in
            refs/tags/*) [ "$REF" = "refs/tags/v$PROJECT" ] || { echo "::error::tag does not match v$PROJECT"; exit 1; } ;;
          esac
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Construir y validar
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jinnexguard
    permissions:
      id-token: write   # el token OIDC que TestPyPI cambia por un permiso de subida de un solo uso
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jinnexguard
    permissions:
      id-token: write   # el token OIDC que PyPI cambia por un permiso de subida de un solo uso
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # Sube también las atestaciones (PEP 740): la procedencia que JinnexGuard revisa en otros.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
