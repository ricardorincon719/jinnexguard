[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jinnexguard"
version = "1.0.0"
description = "Risk signals for a repository or an npm/PyPI package, with evidence. Never runs the target's code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo Rincón" }]
keywords = ["security", "supply-chain", "mcp", "npm", "pypi", "github", "malware"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []          # el motor es stdlib puro, a propósito (auditable y liviano)

[project.optional-dependencies]
mcp = ["mcp>=2.0"]         # solo la capa MCP (API MCPServer); el motor no lo necesita

[project.urls]
Homepage = "https://github.com/ricardorincon719/jinnexguard"
Issues = "https://github.com/ricardorincon719/jinnexguard/issues"
Changelog = "https://github.com/ricardorincon719/jinnexguard/blob/main/CHANGELOG.md"

[project.scripts]
jinnexguard = "jinnexguard.cli:main"
jinnexguard-mcp = "jinnexguard.mcp_server:main"

[tool.setuptools.packages.find]
include = ["jinnexguard*"]
